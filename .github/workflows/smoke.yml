name: smoke

# Functional pre-publish smoke gate (FORGE-S16-T11, issue #22).
#
# Runs on Linux + Node 20 only — multi-OS and multi-Node matrix expansion is
# explicitly deferred to v1.0 maturity (Q24 functional sufficiency).
#
# Auth-free gates run on every push/PR.
# Auth-required gates run only when secrets.ANTHROPIC_API_KEY is configured.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (linux, node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync forge plugin source
        # build-payload.cjs expects the Forge plugin checkout as a sibling at
        # ../forge (per package.json#forge.forgeRoot). Clone it at the pinned
        # bundledVersion tag so the build step can find substitute-placeholders.cjs.
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').forge.bundledVersion")
          echo "Cloning Entelligentsia/forge@v${VERSION} into ../forge"
          git clone --depth 1 --branch "v${VERSION}" https://github.com/Entelligentsia/forge.git ../forge

      - name: Build
        run: npm run build

      - name: Run E2E smoke gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./test/e2e/smoke.sh

      - name: Upload SUMMARY artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-summary
          path: |
            .smoke-out/SUMMARY.md
            .smoke-out/*.log
            .smoke-out/*.out
          if-no-files-found: warn
          retention-days: 7

  tmp-smoke:
    # FORGE-S25-T03, FORGE-S31-T07 — fresh-tmp-project working-product gate.
    # Runs after smoke so pack+install failures fail fast before the bootstrap.
    # Bootstrap is auth-free (no LLM round-trip); 10 min ceiling is conservative.
    name: tmp-smoke (fresh tmp project, linux, node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync forge plugin source
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').forge.bundledVersion")
          echo "Cloning Entelligentsia/forge@v${VERSION} into ../forge"
          git clone --depth 1 --branch "v${VERSION}" https://github.com/Entelligentsia/forge.git ../forge

      - name: Build
        run: npm run build

      - name: Run tmp-smoke gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./test/e2e/tmp-smoke.sh

      - name: Upload tmp-smoke SUMMARY artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmp-smoke-summary
          path: |
            .tmp-smoke-out/SUMMARY.md
            .tmp-smoke-out/*.out
            .tmp-smoke-out/*.log
          if-no-files-found: warn
          retention-days: 7
