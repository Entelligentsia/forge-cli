name: tests

# Fast pre-merge gates for forge-cli (FORGE-S25-T02, FORGE-S25-T28).
#
# Sibling of smoke.yml (FORGE-S16-T11). This workflow runs the cheap checks
# that do NOT need the sibling Forge plugin clone, the full `npm run build`,
# or the .smoke-out artefact pipeline:
#
#   - typecheck (tsc --noEmit)
#   - lint:no-skip (tools/check-no-skipped-tests.cjs)
#   - npm test (vitest, post-FORGE-S25-T02 explicit include/exclude)
#   - dead-code gate (knip, FORGE-S25-T28): exits 1 on unused exports/files
#
# smoke.yml continues to own:
#   - the sibling-forge clone
#   - `npm run build`
#   - `./test/e2e/smoke.sh`
#
# Sibling-workflow rationale (see PLAN §2.7):
#   - Typecheck/lint/vitest give faster signal on the typical edit than the
#     full smoke pipeline.
#   - Independent green/red status on the GH Actions UI per gate.
#   - `cache: npm` makes the duplicated `npm ci` essentially a tarball read.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-skip-gate:
    name: tests + skip gate (linux, node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: No skipped or focused tests
        run: npm run lint:no-skip

      - name: Import-layering gate
        # lib/ depends only downward; see tools/check-import-layering.cjs header.
        run: npm run lint:layering

      - name: Sync forge plugin source
        # The vitest suite includes payload-dependent tests (catalog-loader,
        # bundled-base-pack-markers, parity-gate, …) that read
        # dist/forge-payload. build-payload.cjs expects the Forge plugin
        # checkout as a sibling at ../forge (same pattern as smoke.yml).
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').forge.bundledVersion")
          echo "Cloning Entelligentsia/forge@v${VERSION} into ../forge"
          git clone --depth 1 --branch "v${VERSION}" https://github.com/Entelligentsia/forge.git ../forge

      - name: Build payload bundle
        # Vitest needs dist/forge-payload; full tsc emit comes along with it.
        run: npm run build

      - name: Payload require gate
        # FORGE-S32-T04: statically prove every require()/runtime-path target in
        # the bundled payload's .cjs/.js tools+hooks resolves in-bundle. Runs
        # right after the build (payload exists) and before vitest, so the
        # MODULE_NOT_FOUND drift class (FORGE-BUG-030/036) is caught red here at
        # ~no extra cost — tests.yml already builds the payload for vitest.
        run: npm run lint:payload-requires

      - name: Vitest
        run: npm test

      - name: Dead-code gate (knip)
        # FORGE-S25-T28: exits 1 on unused exports or dead files in src/.
        # Fix locally: npm run dead-code -- --fix (auto-removes safe unused exports)
        # or suppress in knip.config.ts with ignoreIssues (with justification comment).
        run: npm run dead-code
